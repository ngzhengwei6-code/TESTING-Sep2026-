<!DOCTYPE html>
<html>
<head>
<title>CSS</title>
<link rel="icon" href="sunflower.jpg" type="image/jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: oldlace;
  }

  h1 {
    color: navy;
    letter-spacing: 5px; /* 1 */
    text-transform: uppercase; /* 2 */
    text-shadow: 2px 2px 4px gray; /* 3 */
    opacity: 0.9; /* 8 */
  }
  
  p {
    background-color: white;
    color: black;
    padding: 15px; /* 10 */
    border-radius: 10px; /* 4 */
    box-shadow: 3px 3px 8px silver; /* 5 */
    word-spacing: 5px; /* 6 */
  }

  p.first-para {
    text-indent: 30px; /* 7 */
  }

  font {
    color: purple;
    outline: 2px solid red; /* 9 */
  }
</style>
</head>
<body>

<h1>JavaScript</h1>

<p class="first-para">
<font>JavaScript</font> is a scripting or programming language that allows you to implement complex features on web pages.
</p>

<p>
It works seamlessly alongside HTML and CSS.
</p>

<p>
JavaScript's widespread applications in web, mobile app, and game development make it a valuable language to learn.
</p>

</body>
</html>

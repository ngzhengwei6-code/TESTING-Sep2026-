<!DOCTYPE html>
<html>
<head>
<title> My First Website</title>
<link rel=icon href=kirk.jpg type=image/jpg>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<script>
function validateForm(){
let x = document.MyFirstForm.fname.value;
if(x==""){
alert("please provide a first name!");
return false;
}

let y = document.MyFirstForm.lname.value;
var letters = /^[A-Za-z]+$/;
if (!y.match(letters)){
alert("please put only alphabet!");
return false;
}

if ((document.MyFirstForm.gender[0].checked==false)&&(document.MyFirstForm.gender[1].checked==false)){
alert("please choose a gender!");
return false;
}

let subjects = document.MyFirstForm.fav_sub;
let subjectSelected = false;
for(let i = 0; i < subjects.length; i++){
if(subjects[i].checked){
subjectSelected = true;
break;
}
}

if(!subjectSelected){
alert("please select at least one favorite subject!");
return false;
}

return true;
}

function filterSubjects(){
  var selectedCourse = document.getElementById("courseList").value;
  var subjectDropdown = document.getElementById("SubjectList");

  if (selectedCourse ==""){
    subjectDropdown.innerHTML = '<option value="">-Select a course First-</option>';
    subjectDropdown.disabled = true;
  }else if (selectedCourse == "DCS"){
    subjectDropdown.disabled = false;
    subjectDropdown.innerHTML = '<option value="DCS1003">DCS1003</option>' + '<option value="DCS2003">DCS2003</option>'+'<option value="DCS3003">DC3003</option>';
  }else if (selectedCourse == "DIB"){
    subjectDropdown.disabled = false;
    subjectDropdown.innerHTML = '<option value="DIB1003">DIB1003</option>'+ '<option value="DIB2003">DIB2003</option>'+'<option value="DIB3003">DIB3003</option>';
  }else if (selectedCourse == "DAS"){
    subjectDropdown.disabled = false;
    subjectDropdown.innerHTML = '<option value="DAS1003">DAS1003</option>'+ '<option value="DAS2003">DAS2003</option>'+'<option value="DAS3003">DAS3003</option>';
  }
}
</script>

<style>
table{
background-color:powderblue
}
p{
color:#696969;
font-family:verdana;
font-size:160%;
text-align:center;
Width:60%;
height:40%
}
.left-cell {
  background-color:#5E7D7E;
  color: white;
  padding: 8px;
}
</style>
</head>
<body>

<center>

<p>Personal details:</p>

<form name="MyFirstForm" onsubmit="return validateForm()">
<table>
<tr>
<td class="left-cell" align=left>First Name:</td>
<td><input type=text name=fname value="name" size=50 maxlength=10></td>
</tr>
<tr>
<td class="left-cell" align=left>Last Name:</td>
<td><input type=text name=lname placeholder='last name' autofocus size=20 maxlength=5></td>
</tr>
<tr>
<td class="left-cell" align=left>Gender:</td>
<td>
<input type=radio name=gender value=Male>Male
<input type=radio name=gender value=Female>Female
</td>
</tr>
<tr>
<td class="left-cell" align=left>Choose your favorite subject:</td>
<td>
<input type=checkbox name=fav_sub value=DCS4103 checked>DCS4103
<input type=checkbox name=fav_sub value=DCS3003 disabled>DCS3003
<input type=checkbox name=fav_sub value=MST1003>MST1003
<input type=checkbox name=fav_sub value=MST2003>MST2002
</td>
</tr>
<tr>
<td class="left-cell">Address:</td>
<td>
<textarea rows=4 cols=30 name=address></textarea>
</td>
</tr>
<tr>
<td class="left-cell">Date of Birth:</td>
<td>
<input type=date name=dob min=2000-01-01 max=2005-12-31>
</td>
</tr>
<tr>
<td class="left-cell">Login Password:</td>
<td>
<input type=password name=Loginpass readonly>
</td>
</tr>
<tr>
<td class="left-cell">Course:</td>
<td>
<select name="course">
<option value="0">-List of Courses-</option>
<optgroup label="Diploma in Computer Science">
<option value="DCS_s1">-semester 1-</option>
<option value="DCS_s2">-semester 2-</option>
<option value="DCS_s3">-semester 3-</option>
</optgroup>
<option value="DIB">-Diploma in Buisness-</option>
<option value="DAS">-Diploma in Airline Services-</option>
</select>
</td>
</tr>
<tr>
  <td class="left-cell">List of Courses and Subjects</td>
  <td>
    <select id="courseList" onchange="filterSubjects()">
      <option value="">-List of Courses-</option>
      <optgroup label="Available Courses">
        <option value="DCS">Diploma In Computer Science</option>
        <option value="DIB">Diploma In Buisness</option>
        <option value="DAS">Diploma In Airline Services</option>
      </optgroup>
    </select>
    <br>
    <select id="SubjectList" name="subject" disabled>
      <option value="">Choose a CourseFirst</option>
    </select> 
  </td>
</tr>
<tr>
<td colspan="2" align="center">
<br>
<input type=submit value=Submit>
<input type=reset value=Reset>
</td>
</tr>
</table>
</form>

</center>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - NOVA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body onload="initProductPage()">

<header class="site-header">
<div class="container">
<a href="index.html" class="logo">NOVA</a>
<nav class="main-nav">
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a></li>
</ul>
</nav>
</div>
</header>

<section class="product-detail">
<div class="container" id="product-detail-container">
<a href="shop.html" id="back-link" class="back-link" onclick="return goBack()">&larr; Back</a>
<div class="product-detail-layout">
<img id="product-image" src="" alt="">
<div class="product-detail-info">
<h1 id="product-name"></h1>
<p class="price" id="product-price"></p>
<p id="product-description"></p>

<div class="qty-selector">
<button type="button" onclick="changeProductQty(-1)">-</button>
<span id="qty-value">1</span>
<button type="button" onclick="changeProductQty(1)">+</button>
</div>

<button type="button" id="add-to-cart-btn" class="btn btn-primary" onclick="handleAddToCart()">Add to Cart</button>
<p id="add-to-cart-message" class="confirm-message" style="display: none;">Added to cart!</p>
</div>
</div>
</div>
</section>

<footer class="site-footer">
&copy; 2026 NOVA. All rights reserved.
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>

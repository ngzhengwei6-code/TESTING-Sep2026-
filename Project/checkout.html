<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - NOVA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body onload="initCheckoutPage()">

<header class="site-header">
<div class="container">
<a href="index.html" class="logo">NOVA</a>
<nav class="main-nav">
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a></li>
</ul>
</nav>
</div>
</header>

<section class="checkout-page">
<div class="container">
<a href="cart.html" id="back-link" class="back-link" onclick="return goBack()">&larr; Back</a>
<h1 class="page-title">Checkout</h1>

<div class="checkout-layout" id="checkout-layout">
<form name="checkoutForm" id="checkout-form" class="checkout-form" onsubmit="return submitOrder()">
<h2>Delivery Details</h2>

<label for="full-name">Full Name</label>
<input type="text" id="full-name" name="fullName">

<label for="email">Email</label>
<input type="email" id="email" name="email">

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone">

<label for="address">Delivery Address</label>
<textarea id="address" name="address" rows="3"></textarea>

<label for="city">City / Postcode</label>
<input type="text" id="city" name="city">

<button type="submit" class="btn btn-primary">Place Order</button>
</form>

<aside class="order-summary" id="order-summary"></aside>
</div>

<div id="order-confirmation" class="order-confirmation" style="display: none;">
<h2>Thank you, <span id="confirm-name"></span>!</h2>
<p>Your order <strong id="confirm-order-number"></strong> has been placed.</p>
<p>A confirmation would normally be emailed to <span id="confirm-email"></span>.</p>
<a href="index.html" class="btn btn-secondary">Back to Home</a>
</div>
</div>
</section>

<footer class="site-footer">
&copy; 2026 NOVA. All rights reserved.
</footer>

<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
